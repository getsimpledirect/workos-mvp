services:
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp | grep -q '1F40' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Primary: Qwen3-14B — Hybrid reasoning + fast response
  vllm-qwen3-14b:
    image: vllm/vllm-openai:v0.8.5
    container_name: vllm-qwen3-14b
    ipc: host
    ports:
      - "8001:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
    command: >
      --model Qwen/Qwen3-14B-AWQ
      --quantization awq_marlin
      --max-model-len 28000
      --max-num-seqs 4
      --dtype half
      --gpu-memory-utilization 0.75
      --swap-space 0
      --enable-prefix-caching
      --enforce-eager
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    depends_on:
      chroma:
        condition: service_healthy

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"
    volumes:
      # Mount config files directly to avoid permissions issues when the container drops to 'searxng' user
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://vllm-qwen3-14b:8000/v1
      - OPENAI_API_KEY=not-needed
      - ENABLE_OLLAMA_API=false
      - ENABLE_OPENAI_API=true
      - VECTOR_DB=chroma
      - CHROMA_HTTP_HOST=chroma
      - CHROMA_HTTP_PORT=8000
      - ENABLE_SIGNUP=false
      - DEFAULT_USER_ROLE=pending
      - ENABLE_COMMUNITY_SHARING=false
      - WEBUI_URL=${WEBUI_URL:-http://localhost:3000}
      # Web Search via SearXNG
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
      
      # Advanced RAG & Search Optimizations
      - RAG_WEB_SEARCH_RESULT_COUNT=8
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=10
      - CHUNK_SIZE=1500
      - CHUNK_OVERLAP=150
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      chroma:
        condition: service_healthy
      searxng:
        condition: service_started

volumes:
  chroma_data:
  open-webui_data:
